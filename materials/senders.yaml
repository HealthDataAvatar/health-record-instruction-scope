# Letter senders, shared by every instruction so letters are consistent with each other and the
# background files. Each instruction names a sender by id. Draft by Claude for Hex to edit.
#
# A letter is assembled as: letterhead (organisation, department, address, phone), date, patient
# block (name, address, date of birth, hospital number if any), "Re: <subject>" if
# the letter has one, "Dear <title> <last_name>,", the instruction's body, "Yours sincerely,",
# the signer's name and role, "on behalf of <on_behalf_of>" if the sender has one, and "cc:" the
# patient's GP (omitted when the sender is the GP, or has `cc_gp: false`).
#
# Phone numbers are invented in the 01408 647xxx block (Golspie), checked against public listings (D26).

